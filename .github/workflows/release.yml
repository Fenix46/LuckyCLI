name: Release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds the standalone binaries for every platform and publishes them as
# a GitHub Release, with auto-generated changelog notes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, so git-cliff can build the changelog

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build # emits @luckycli/core dist so the bundler can resolve it

      - name: Build standalone binaries
        run: bun run scripts/build.ts
        env:
          LUCKY_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.LUCKY_GOOGLE_OAUTH_CLIENT_ID }}
          LUCKY_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.LUCKY_GOOGLE_OAUTH_CLIENT_SECRET }}
          LUCKY_ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.LUCKY_ANTIGRAVITY_OAUTH_CLIENT_ID }}
          LUCKY_ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.LUCKY_ANTIGRAVITY_OAUTH_CLIENT_SECRET }}

      - name: Generate checksums
        run: |
          cd dist-bin
          shasum -a 256 lucky-* > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist-bin/*
          body: ${{ steps.changelog.outputs.content }}
          fail_on_unmatched_files: true
