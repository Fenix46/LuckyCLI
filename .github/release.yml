# Controls how GitHub auto-generates the release changelog
# (used by `generate_release_notes: true` in .github/workflows/release.yml).
# Notes are built from pull requests merged since the previous tag, grouped
# into the categories below by their labels.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 🧰 Maintenance & Docs
      labels:
        - chore
        - build
        - ci
        - docs
    - title: Other Changes
      labels:
        - "*"
