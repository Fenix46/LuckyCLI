<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lucky bridge</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 32px;
        background: #11131a;
        color: #e6e8ef;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      p {
        color: #9aa3b2;
        line-height: 1.5;
      }
      ol {
        color: #9aa3b2;
        line-height: 1.6;
        padding-left: 20px;
      }
      label {
        display: block;
        margin: 18px 0 6px;
        font-size: 13px;
        color: #9aa3b2;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #2b3040;
        background: #171a23;
        color: #e6e8ef;
        font: inherit;
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }
      button {
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid #2b3040;
        background: #1d2230;
        color: #e6e8ef;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #4f7cff;
        border-color: #4f7cff;
      }
      code {
        background: #171a23;
        border-radius: 6px;
        padding: 2px 6px;
      }
      #status {
        margin-top: 18px;
        min-height: 20px;
        font-size: 13px;
      }
      #status.ok {
        color: #57d38c;
      }
      #status.err {
        color: #ff7b72;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lucky bridge</h1>
      <p>
        Run <code>/browser</code> in Lucky to see the port and token for this
        session. Enter them here once; the extension reconnects automatically.
      </p>
      <ol>
        <li>Open Lucky and run <code>/browser</code>.</li>
        <li>Copy the port and token into the fields below.</li>
        <li>Save, then check the connection.</li>
      </ol>
      <form id="form">
        <label for="port">Port</label>
        <input id="port" name="port" inputmode="numeric" placeholder="17321" />
        <label for="token">Token</label>
        <input id="token" name="token" autocomplete="off" spellcheck="false" placeholder="Bearer token" />
        <div class="row">
          <button class="primary" type="submit">Save</button>
          <button type="button" id="check">Check connection</button>
        </div>
        <div id="status"></div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
